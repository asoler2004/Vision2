<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agente de Publicaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 900px;
      padding: 24px;
    }
    .card {
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1f2937;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.7rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span.logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      display: inline-block;
    }
    p.subtitle {
      margin-top: 4px;
      margin-bottom: 20px;
      color: #9ca3af;
      font-size: 0.95rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr);
      gap: 16px;
    }
    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    label {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 4px;
      display: block;
    }
    input[type="file"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="file"] {
      padding: 6px;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #38bdf8;
    }
    .field {
      margin-bottom: 12px;
    }
    .tone-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .tone-grid button {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tone-grid button.active {
      border-color: #38bdf8;
      background: rgba(56,189,248,0.12);
    }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-primary {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #020617;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .small {
      font-size: 0.8rem;
      color: #6b7280;
    }
    .output {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #111827;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .output-block {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #111827;
      padding: 12px 14px;
      font-size: 0.9rem;
      white-space: pre-wrap;
      max-height: auto;
      overflow: auto;
    }
    .output-block h2 {
      margin-top: 0;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    code {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular;
      font-size: 0.8rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 3px 8px;
      border: 1px solid #374151;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .badge span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
    }
    .error {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #f97373;
    }

    .status-message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }

    .status-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status-message.loading {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }


    .status-message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }

    .status-message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status-message.loading {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>
        <span class="logo-dot"></span>
        Agente de publicaciones
      </h1>
      <p class="subtitle">
        Sube una imagen, describe la idea, elige un tono y la plataforma. El agente se encarga del copy.
      </p>

      <form id="postForm">
        <div class="form-grid">
          <div>
            <div class="field">
              <label for="image">Imagen</label>
              <input id="image" name="image" type="file" accept="image/*" required>
            </div>

            <div class="field">
              <label for="desc">Descripción de la publicación</label>
              <textarea id="desc" name="desc" placeholder="Ej: Promoción 2x1 en gelatinas navideñas..." required></textarea>
            </div>
          </div>

          <div>
            <div class="field">
              <label>Tono sugerido</label>
              <div class="tone-grid">
                <button type="button" data-tone="cálido y festivo">Cálido y festivo</button>
                <button type="button" data-tone="profesional y sobrio">Profesional</button>
                <button type="button" data-tone="divertido y cercano">Divertido</button>
                <button type="button" data-tone="elegante y minimalista">Elegante</button>
              </div>
            </div>

            <div class="field">
              <label for="tone">Tono (editable)</label>
              <input id="tone" name="tone" type="text" placeholder="Ej: cálido y festivo" required>
            </div>

            <div class="field">
              <label for="platform">Plataforma de salida</label>
              <select id="platform" name="platform" required>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
                <option value="linkedin">LinkedIn</option>
                <option value="html">HTML snippet</option>
              </select>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="submitBtn" class="btn-primary" type="submit">
            Generar publicación
          </button>
          <span class="small">
            El resultado aparecerá abajo.
          </span>
          <button id="supabaseBtn" class="btn-primary" type="button" onclick="SaveSupabase()">
            Guardar publicación
          </button>
          <button id="supabaseBtn" class="btn-primary" type="button" onclick="SaveSupabase()">
            Guardar publicación
          </button>
        </div>
        <div id="errorMsg" class="error" style="display:none;"></div>
        <div class="status-message" id="statusMessage"></div>
        <div class="status-message" id="statusMessage"></div>
      </form>

      <div class="output" id="outputSection" style="display:none;">

        <div class="output-block">
          <h2>
            Resultado
            <span class="badge">
              <span class="dot"></span>
              <span id="platformBadge"></span>
            </span>
          </h2>

          <img id="previewImage" 
               src="" 
               alt="Imagen subida" 
               style="max-width:100%; border-radius:12px; border:1px solid #111827; margin-bottom:12px; display:none;">

          <div id="contentText"></div>
          <div id="hashtagsText" class="small" style="margin-top:8px;"></div>
        </div>

        <div class="output-block">
          <h2>Estructura interna (debug)</h2>
          <code id="rawJson"></code>
        </div>

      </div>
    </div>
  </div>

  <script>
    const toneButtons = document.querySelectorAll(".tone-grid button");
    const toneInput = document.getElementById("tone");
    const form = document.getElementById("postForm");
    const submitBtn = document.getElementById("submitBtn");
    const supabaseBtn = document.getElementById("supabaseBtn");
    const supabaseBtn = document.getElementById("supabaseBtn");
    const errorMsg = document.getElementById("errorMsg");
    const outputSection = document.getElementById("outputSection");
    const platformBadge = document.getElementById("platformBadge");
    const contentText = document.getElementById("contentText");
    const hashtagsText = document.getElementById("hashtagsText");
    const rawJson = document.getElementById("rawJson");
    const previewImage = document.getElementById("previewImage");
    const statusMessage = document.getElementById("statusMessage");
    const image = document.getElementById("image");

    function showMessage(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;

      if (type === 'loading') {
        statusMessage.innerHTML = `<span class="spinner"></span>${message}`;
      }
      statusMessage.style.display = 'block';
    }
    const statusMessage = document.getElementById("statusMessage");
    const image = document.getElementById("image");

    function showMessage(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;

      if (type === 'loading') {
        statusMessage.innerHTML = `<span class="spinner"></span>${message}`;
      }
      statusMessage.style.display = 'block';
    }

    toneButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const tone = btn.getAttribute("data-tone");
        toneInput.value = tone;
        toneButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    async function SaveSupabase() {
      const parsedJson = JSON.parse(rawJson.innerHTML.replace(/\n/g,''));
      // console.log("rawJson = ", );
      const bodycontent = {
      "body": parsedJson.body,
      "hook": parsedJson.hook,
      "full_text": parsedJson,
      "call_to_action": parsedJson.call_to_action
      };
      // console.log("bodycontent = ", );
      const metadata = {
        "benefits": parsedJson.benefits,
        "hashtags": parsedJson.hashtags,
        "platform": document.getElementById("platform").value,
      }
      console.log("linea 355 - bodycontent = " ,bodycontent);
      console.log("linea 363 - metadata = " ,metadata);

      const filepath = document.getElementById("image").files[0];
      console.log("linea 363 - filepath = " ,filepath.name);
      // console.log("linea 363 - fileInput.files[0] = ", fileInput.files[0]); 
      supabaseBtn.disabled = true;
      showMessage("Guardando imagen...", "loading");

      try {
        const imagedata = await fileToBase64(filepath);
        //console.log(imagedata)
        // console.log(JSON.stringify({
        //     user_id: 'demo_user',
        //     title: parsedJson.headline,
        //     tone: toneInput.value,
        //     content: bodycontent,
        //     images: filepath.name, 
        //     imagedata: imagedata,  
        //     status: 'published',
        //     version: '1',       
        //     metadata: metadata,  
        //   }))
        console.log("image data done");
        
        const options = {
          method: 'POST',
          headers: {'Content-Type': 'application/json', },                    
          body: JSON.stringify({
            user_id: 'demo_user',
            title: parsedJson.headline,
            tone: toneInput.value,
            content: bodycontent,
            images: filepath.name, 
            imagedata: imagedata,  
            status: 'published',
            version: '1',       
            metadata: metadata,  
        })};

        console.log("options: ", options)  
        const response = await fetch("http://localhost:5000/upload", options);
        const result = await response.json();
        console.log("linea 380 - result = ", result);

        // .then(response => response.json())
        // .then(data => console.log(data));
    
        console.log("response.ok: ",response.ok)
        // const result = await response.json();
        

        if (response.ok) {
          showMessage("Historia guardada",'success');
        } else { showMessage('Error: ${result.error}','error'); }
      } catch (error) {
          showMessage('${error.message}','error');
          console.error("Upload error:",error);
      } finally {
        supabaseBtn.disabled = false;
      }    
    };

    supabaseBtn.addEventListener("click", SaveSupabase);

    document.getElementById("image").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        previewImage.src = reader.result;
        previewImage.style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      outputSection.style.display = "none";

      const fileInput = document.getElementById("image");
      if (!fileInput.files[0]) {
        errorMsg.textContent = "Sube una imagen primero.";
        errorMsg.style.display = "block";
        return;
      }

      const formData = new FormData();
      formData.append("image", fileInput.files[0]);
      formData.append("desc", document.getElementById("desc").value);
      formData.append("tone", document.getElementById("tone").value);
      formData.append("platform", document.getElementById("platform").value);

      submitBtn.disabled = true;
      submitBtn.textContent = "Generando...";

      try {
        const res = await fetch("/generate_post", {
          method: "POST",
          body: formData
        });

        if (!res.ok) {
          throw new Error("Error en la API: " + res.status);
        }

        const data = await res.json();

        platformBadge.textContent = data.platform || "";
        contentText.textContent = data.content || "";

        if (Array.isArray(data.hashtags) && data.hashtags.length > 0) {
          hashtagsText.textContent = "Hashtags: " + data.hashtags.join(" ");
        } else {
          hashtagsText.textContent = "";
        }

        rawJson.textContent = JSON.stringify(data.raw_structure || {}, null, 2);

        outputSection.style.display = "flex";

      } catch (err) {
        errorMsg.textContent = "Ocurrió un error: " + err.message;
        errorMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Generar publicación";
        showMessage("Diseño de historia.",'success');
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);});
    }
    

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);});
    }
    
  </script>
</body>
</html>
